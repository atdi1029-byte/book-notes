    <rect x="100" y="-94" width="14" height="94" fill="#facc15" opacity="0.55" rx="2"/>
    <rect x="120" y="-92" width="14" height="92" fill="#a78bfa" opacity="0.55" rx="2"/>
    <rect x="140" y="-104" width="14" height="104" fill="#facc15" opacity="0.55" rx="2"/>
    <rect x="160" y="-68" width="14" height="68" fill="#fb923c" opacity="0.55" rx="2"/>
    <rect x="180" y="-84" width="14" height="84" fill="#f87171" opacity="0.55" rx="2"/>
    <rect x="200" y="-92" width="14" height="92" fill="#facc15" opacity="0.55" rx="2"/>

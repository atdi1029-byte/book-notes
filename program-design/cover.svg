    <rect x="300" y="-56" width="14" height="56" fill="#f87171" opacity="0.55" rx="2"/>
    <polyline points="7,-2 27,-18 47,-14 67,-20 87,-8 107,-10 127,-12 147,-30 167,-78 187,-58 207,-96 227,-144 247,-118 267,-62 287,-46 307,-34" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linejoin="round"/>

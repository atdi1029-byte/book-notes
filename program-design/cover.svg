  <text x="200" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#ffffff">The Program</text>
  <text x="200" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#6b8cff">Design Guide</text>
  <text x="200" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7a7f9a">Sixteen trainer programs, reverse-engineered</text>
  <text x="200" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7a7f9a">into the rules that built them</text>
  <text x="200" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7a7f9a" letter-spacing="1">VOLUME · INTENSITY · THE WAVE</text>

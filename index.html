<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0804">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Book Notes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e0804;
    color: #e8dcc8;
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.7;
    min-height: 100vh;
  }

  .bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('bg.jpg') center/cover no-repeat;
    image-rendering: -webkit-optimize-contrast;
    z-index: 0;
  }

  .fade {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.35);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 2.5rem 1.5rem;
    max-width: 960px;
    margin: 0 auto;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 {
    font-size: 2.2rem;
    color: #fff;
    margin-bottom: 0.3rem;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }

  .master-list-link {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: rgba(255,255,255,0.6);
    font-size: 0.8rem;
    font-family: -apple-system, sans-serif;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .master-list-link:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
  }

  .master-list-link svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .subtitle {
    color: rgba(255,255,255,0.7);
    font-size: 1rem;
    font-style: italic;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }

  .shelf {
    display: flex;
    gap: 1.2rem;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .shelf::-webkit-scrollbar { display: none; }

  .book {
    display: block;
    text-decoration: none;
    color: #e8dcc8;
    transition: transform 0.25s ease;
    position: relative;
    min-width: 160px;
    width: calc(33.333% - 0.8rem);
    flex-shrink: 0;
  }

  .book:hover {
    transform: translateY(-8px);
  }

  .cover-wrap {
    position: relative;
    border-radius: 4px 8px 8px 4px;
    overflow: hidden;
  }

  .cover-wrap::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(to right, rgba(0,0,0,0.5), rgba(80,50,20,0.3), transparent);
    z-index: 1;
  }

  .cover-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px 8px 8px 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    pointer-events: none;
    z-index: 1;
  }

  .book-cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    transition: box-shadow 0.25s ease;
    box-shadow:
      2px 4px 12px rgba(0,0,0,0.6),
      6px 10px 28px rgba(0,0,0,0.4),
      0 12px 30px rgba(0,0,0,0.35);
  }

  .book:hover .book-cover {
    box-shadow:
      2px 4px 16px rgba(0,0,0,0.7),
      8px 14px 36px rgba(0,0,0,0.5),
      0 16px 40px rgba(0,0,0,0.4),
      0 0 40px rgba(180,120,40,0.1);
  }

  .read-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, #3a9e4a, #2a8538);
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    cursor: pointer;
    z-index: 3;
    border: 2px solid rgba(255,255,255,0.2);
    padding: 0;
  }

  .read-badge svg {
    width: 16px;
    height: 16px;
    fill: white;
  }

  .read-badge.show { display: flex; }

  .mark-read {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(232,220,200,0.35);
    border-radius: 50%;
    cursor: pointer;
    z-index: 3;
    padding: 0;
  }

  .mark-read.hide { display: none; }

  .move-to-shelf {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(25, 100, 200, 0.88);
    color: #fff;
    border: none;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 5px 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.18s;
    text-transform: uppercase;
    z-index: 4;
    text-align: center;
  }
  #toReadView .book:hover .move-to-shelf {
    opacity: 1;
  }

  .book-title {
    font-size: 0.95rem;
    color: #fff;
    font-weight: 700;
    margin-top: 0.75rem;
    line-height: 1.3;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  .book-author {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.45);
    margin-top: 0.2rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-style: italic;
  }


  /* Reading progress bar under covers */
  .read-progress-wrap {
    display: none;
  }
  .read-progress-bar {
    display: none;
  }
  .read-eta {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.45);
    font-family: -apple-system, sans-serif;
    margin-top: 0.15rem;
    letter-spacing: 0.02em;
  }

  .section-title {
    font-size: 1.1rem;
    color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    margin-top: 3rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-style: italic;
    letter-spacing: 0.02em;
  }

  .section-title:first-of-type {
    margin-top: 0;
  }

  .filter-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 0.35rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 0.85rem;
    transition: background 0.2s, border-color 0.2s;
  }
  .filter-btn:hover { background: rgba(255,255,255,0.2); }
  .filter-btn.active {
    background: rgba(58,158,74,0.5);
    border-color: rgba(58,158,74,0.8);
  }

  .book.hidden-read { display: none; }
  .book.hidden-reading { display: none; }

  /* Tier badges on To Read covers */
  .tier-badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    z-index: 4;
    pointer-events: none;
    font-family: -apple-system, sans-serif;
  }
  .tier-now {
    background: rgba(58,158,74,0.92);
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .tier-soon {
    background: rgba(52,120,200,0.92);
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .tier-later {
    background: rgba(80,80,80,0.85);
    color: rgba(255,255,255,0.8);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* Reading guide key */
  .tier-guide {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .tier-guide-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
  }
  .tier-guide-item .tier-badge {
    position: static;
    font-size: 0.6rem;
  }
  .tier-guide-note {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.45);
    font-style: italic;
  }

  .tab-row {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
  }

  .tab-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
    padding: 0.5rem 1.5rem;
    cursor: pointer;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 0.95rem;
    transition: all 0.2s;
  }

  .tab-btn:first-child {
    border-radius: 8px 0 0 8px;
  }

  .tab-btn:last-child {
    border-radius: 0 8px 8px 0;
    border-left: none;
  }

  .tab-btn:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.8);
  }

  .tab-btn.active {
    background: rgba(180,120,40,0.3);
    border-color: rgba(180,120,40,0.6);
    color: #fff;
  }

  .view-hidden { display: none !important; }


  @media (max-width: 600px) {
    .bg { background-size: auto 100%; background-position: center center; }
    .content { padding: 1.2rem; }
    h1 { font-size: 1.6rem; }
    .book { width: 40vw; min-width: 140px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="fade"></div>

<div class="content">
  <div class="header-row">
  <h1>Book Notes</h1>
  <div style="display:flex;gap:8px">
  <a class="master-list-link" href="web.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><line x1="8" y1="7.5" x2="10.5" y2="10.5"/><line x1="16" y1="7.5" x2="13.5" y2="10.5"/><line x1="8" y1="16.5" x2="10.5" y2="13.5"/><line x1="16" y1="16.5" x2="13.5" y2="13.5"/></svg>
    Book Universe
  </a>
  <a class="master-list-link" href="https://atdi1029-byte.github.io/reading-list/" target="_blank">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    Master List
  </a>
  </div>
  </div>
  <p class="subtitle">Personal library of summaries &amp; detailed notes
    <button class="filter-btn active" id="filterUnread" onclick="toggleFilter()">Unread</button>
  </p>

  <div class="tab-row">
    <button class="tab-btn active" id="tabShelf" onclick="switchTab('shelf')">Shelf</button>
    <button class="tab-btn" id="tabToRead" onclick="switchTab('toread')">To Read</button>
  </div>


  <div id="shelfView">
  </div><!-- end shelfView -->

  <div id="toReadView" class="view-hidden">
    <h2 class="section-title" style="margin-top:0;">To Read</h2>
    <p style="color:rgba(255,255,255,0.5);font-style:italic;
      margin-bottom:1rem;font-size:0.9rem;">
      Books built and ready &mdash; reading order based on
      what you've already read.
    </p>
    <div class="tier-guide">
      <div class="tier-guide-item">
        <span class="tier-badge tier-now">Now</span>
        <span>builds directly on books you've read</span>
      </div>
      <div class="tier-guide-item">
        <span class="tier-badge tier-soon">Soon</span>
        <span>core reads, solid foundation needed</span>
      </div>
      <div class="tier-guide-item">
        <span class="tier-badge tier-later">Later</span>
        <span>worth it, no urgency</span>
      </div>
    </div>
  </div><!-- end toReadView -->

<script>
// ── Catalog Renderer ──
// Renders shelf and To Read from books.json (single source of truth)
(function() {
  var CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12'
    + 'l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildCard(book, format, opts) {
    var isPlain = (format === 'plain');
    var fmt = book.formats[format];
    if (!fmt) return '';
    var id = isPlain ? (fmt.id || book.id + '-plain') : book.id;
    var bmkey = fmt.bmkey || book.bmkey;
    var href = book.folder + '/' + fmt.file;
    var title = book.title;
    if (isPlain) title += ' (Plain English)';
    var author = book.author;
    var coverSrc = book.cover
      ? book.folder + '/' + book.cover : '';
    var tier = opts.tier || null;

    var html = '<a class="book" href="' + escHtml(href)
      + '" data-book="' + escHtml(id)
      + '" data-bmkey="' + escHtml(bmkey) + '">';
    html += '<div class="cover-wrap">';

    if (coverSrc) {
      html += '<img class="book-cover" loading="lazy" src="'
        + escHtml(coverSrc) + '" alt="'
        + escHtml(title) + '">';
    } else {
      // CSS-only cover for guides
      html += '<div class="book-cover" style="background:'
        + 'linear-gradient(135deg,#0d1117,#1a2332,#0d1117);'
        + 'display:flex;align-items:center;justify-content:'
        + 'center;padding:12px;text-align:center;">'
        + '<div style="font-size:14px;font-weight:700;'
        + 'color:#58a6ff;font-family:Playfair Display,serif">'
        + escHtml(title) + '</div></div>';
    }

    if (tier) {
      html += '<span class="tier-badge tier-' + tier + '">'
        + tier.charAt(0).toUpperCase() + tier.slice(1)
        + '</span>';
    }

    html += '<button class="mark-read" onclick="toggleRead('
      + "event,'" + escHtml(id) + "')" + '"'
      + ' title="Mark as read"></button>';
    html += '<button class="read-badge" onclick="toggleRead('
      + "event,'" + escHtml(id) + "')" + '"'
      + ' title="Read! Click to unmark">' + CHECK_SVG
      + '</button>';
    html += '</div>';
    html += '<div class="book-title">'
      + escHtml(title) + '</div>';
    html += '<div class="book-author">'
      + escHtml(author) + '</div>';
    html += '</a>';
    return html;
  }

  function renderCatalog(data) {
    var shelfView = document.getElementById('shelfView');
    var toReadView = document.getElementById('toReadView');
    var categories = data.categories || [];
    var books = data.books || [];
    var moved = (function() {
      try {
        return JSON.parse(
          localStorage.getItem('books_moved_to_shelf')
        ) || {};
      } catch(e) { return {}; }
    })();

    // ── Build Shelf ──
    var shelfHtml = '';
    categories.forEach(function(cat) {
      var catBooks = books.filter(function(b) {
        return b.built && b.category === cat;
      });
      if (catBooks.length === 0) return;

      shelfHtml += '<h2 class="section-title">'
        + escHtml(cat) + '</h2>';
      shelfHtml += '<div class="shelf">';

      catBooks.forEach(function(b) {
        // Full edition
        if (b.formats.full) {
          shelfHtml += buildCard(b, 'full', {});
        }
        // Plain edition as separate card
        if (b.formats.plain) {
          shelfHtml += buildCard(b, 'plain', {});
        }
      });

      shelfHtml += '</div>';
    });
    shelfView.innerHTML = shelfHtml;

    // ── Build To Read ──
    var queueBooks = books.filter(function(b) {
      return b.queue && b.built;
    });

    // Group by category, within each sort by tier priority
    var tierOrder = { now: 0, soon: 1, later: 2 };
    var queueByCat = {};
    queueBooks.forEach(function(b) {
      var cat = b.category;
      if (!queueByCat[cat]) queueByCat[cat] = [];
      queueByCat[cat].push(b);
    });

    // Sort within each category by tier
    Object.keys(queueByCat).forEach(function(cat) {
      queueByCat[cat].sort(function(a, b) {
        var ta = tierOrder[a.queue.tier] || 9;
        var tb = tierOrder[b.queue.tier] || 9;
        return ta - tb;
      });
    });

    var queueHtml = '';
    categories.forEach(function(cat) {
      var catQueue = queueByCat[cat];
      if (!catQueue || catQueue.length === 0) return;

      queueHtml += '<h2 class="section-title">'
        + escHtml(cat) + '</h2>';
      queueHtml += '<div class="shelf">';

      catQueue.forEach(function(b) {
        var tier = b.queue.tier;
        var id = b.id;
        // Check if moved out of queue
        var entry = moved[id];
        var isHidden = entry && !entry.removed;

        if (b.formats.full) {
          var card = buildCard(b, 'full', { tier: tier });
          if (isHidden) {
            card = card.replace(
              'class="book"',
              'class="book" style="display:none"'
            );
          }
          queueHtml += card;
        }
        if (b.formats.plain) {
          var pcard = buildCard(b, 'plain', { tier: tier });
          if (isHidden) {
            pcard = pcard.replace(
              'class="book"',
              'class="book" style="display:none"'
            );
          }
          queueHtml += pcard;
        }
      });

      queueHtml += '</div>';
    });

    // Inject after the tier guide
    var tierGuide = toReadView.querySelector('.tier-guide');
    if (tierGuide) {
      // Remove any previously rendered queue sections
      var existing = toReadView.querySelectorAll(
        '.section-title, .shelf'
      );
      existing.forEach(function(el) {
        if (el !== toReadView.querySelector('.section-title'))
          el.remove();
      });
      tierGuide.insertAdjacentHTML('afterend', queueHtml);
    }

    // Inject "→ Shelf" buttons
    toReadView.querySelectorAll('.book').forEach(
      function(el) {
        if (el.querySelector('.move-to-shelf')) return;
        var id = el.dataset.book;
        // Find section name
        var shelfDiv = el.parentElement;
        var prev = shelfDiv
          ? shelfDiv.previousElementSibling : null;
        while (prev) {
          if (prev.classList.contains('section-title')) break;
          prev = prev.previousElementSibling;
        }
        var section = prev ? prev.textContent.trim() : '';
        var btn = document.createElement('button');
        btn.className = 'move-to-shelf';
        btn.title = 'Move to shelf';
        btn.textContent = '\u2192 Shelf';
        btn.onclick = function(e) {
          moveToShelf(e, id, section);
        };
        var wrap = el.querySelector('.cover-wrap');
        if (wrap) wrap.appendChild(btn);
      }
    );
  }

  // Fetch and render
  fetch('books.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      window._catalogData = data;
      renderCatalog(data);
      // Trigger initial render for read state
      if (typeof render === 'function') render();
      if (typeof window._renderProgress === 'function')
        window._renderProgress();
    })
    .catch(function(err) {
      console.error('Failed to load books.json:', err);
    });
})();
</script>


</div>

<script>
  var KEY = 'books_read';
  var filtering = true;
  var activeBookmarks = (function() {
    try { return JSON.parse(localStorage.getItem('books_bookmarks')) || {}; }
    catch(e) { return {}; }
  })(); // load from localStorage first, sync overwrites later
  var syncReady = false; // blocks pushes until initial remote fetch completes
  // Paste your deployed Apps Script web app URL here:
  var SYNC_URL = 'https://script.google.com/macros/s/AKfycbwt438APIycBc534W6T66O3IgtxLUU9cczw-PZAN6Mc9p2xfU2ySsND_wEMJDHUvrXyUg/exec';

  function getRead() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; }
  }

  function saveRead(read) {
    localStorage.setItem(KEY, JSON.stringify(read));
  }

  function jsonpFetch(url, cb) {
    var cbName = '_booksCb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    var script = document.createElement('script');
    var done = false;
    window[cbName] = function(resp) { done = true; delete window[cbName]; script.remove(); cb(null, resp); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    script.onerror = function() { if (!done) { delete window[cbName]; script.remove(); cb('Failed'); } };
    setTimeout(function() { if (!done) { delete window[cbName]; script.remove(); cb('Timeout'); } }, 15000);
    document.head.appendChild(script);
  }

  function toggleRead(e, id) {
    e.preventDefault();
    e.stopPropagation();
    var read = getRead();
    var nowRead = !read[id];
    if (nowRead) { read[id] = true; } else { delete read[id]; }
    saveRead(read);
    render();
    // Sync individual toggle to backend (safe — never wipes other data)
    if (syncReady && SYNC_URL && SYNC_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
      jsonpFetch(SYNC_URL + '?action=toggle_read&book=' + encodeURIComponent(id) + '&read=' + nowRead, function(){});
    }
  }

  function switchTab(tab) {
    var shelfView = document.getElementById('shelfView');
    var toReadView = document.getElementById('toReadView');
    var tabShelf = document.getElementById('tabShelf');
    var tabToRead = document.getElementById('tabToRead');
    if (tab === 'shelf') {
      shelfView.classList.remove('view-hidden');
      toReadView.classList.add('view-hidden');
      tabShelf.classList.add('active');
      tabToRead.classList.remove('active');
    } else {
      shelfView.classList.add('view-hidden');
      toReadView.classList.remove('view-hidden');
      tabShelf.classList.remove('active');
      tabToRead.classList.add('active');
    }
  }

  function toggleFilter() {
    filtering = !filtering;
    document.getElementById('filterUnread').classList.toggle('active', filtering);
    render();
  }

  function render() {
    var read = getRead();

    document.querySelectorAll('.content .shelf .book').forEach(function(el) {
      var id = el.dataset.book;
      var badge = el.querySelector('.read-badge');
      var btn = el.querySelector('.mark-read');
      if (read[id]) {
        badge.classList.add('show');
        btn.classList.add('hide');
        el.classList.toggle('hidden-read', filtering);
      } else {
        badge.classList.remove('show');
        btn.classList.remove('hide');
        el.classList.remove('hidden-read');
      }
    });

    if (typeof renderMovedToShelf === 'function') renderMovedToShelf();
    // Hide/show category sections AFTER moved cards are injected
    document.querySelectorAll('#shelfView .section-title:not(#recentlyAddedTitle)').forEach(function(title) {
      var shelf = title.nextElementSibling;
      if (!shelf || !shelf.classList.contains('shelf')) return;
      var hasVisible = false;
      shelf.querySelectorAll('.book').forEach(function(b) {
        if (b.style.display !== 'none' && !b.classList.contains('hidden-read')) hasVisible = true;
      });
      title.style.display = hasVisible ? '' : 'none';
      shelf.style.display = hasVisible ? '' : 'none';
    });
  }

  // Initial render from localStorage (instant)
  render();

  // Sync from backend on load
  function syncFromBackend() {
    if (!SYNC_URL || SYNC_URL === 'YOUR_APPS_SCRIPT_URL_HERE') { syncReady = true; return; }
    var got = 0;
    function checkDone() {
      got++;
      if (got >= 3) {
        syncReady = true;
        render();
        // Pre-cache reading books after sync completes
        if (typeof precacheReadingBooks === 'function') {
          precacheReadingBooks();
        }
      }
    }
    jsonpFetch(SYNC_URL + '?action=get_read', function(err, readData) {
      if (!err && readData && readData.status === 'ok' && readData.books_read) {
        saveRead(readData.books_read);
      }
      checkDone();
    });
    jsonpFetch(SYNC_URL + '?action=get_bookmarks', function(err, bmData) {
      if (!err && bmData && bmData.status === 'ok' && bmData.bookmarks) {
        activeBookmarks = bmData.bookmarks;
        localStorage.setItem('books_bookmarks', JSON.stringify(activeBookmarks));
        // Merge reading speed data from same response (avoids second request)
        if (window._RS_KEY && bmData.bookmarks[window._RS_KEY]) {
          var remote = bmData.bookmarks[window._RS_KEY];
          var local;
          try { local = JSON.parse(localStorage.getItem(window._RS_KEY)); }
          catch(e) { local = null; }
          if (!local) local = { books: {}, sessions: [] };
          var changed = false;
          if (remote.books) {
            if (!local.books) local.books = {};
            Object.keys(remote.books).forEach(function(path) {
              var rb = remote.books[path];
              var lb = local.books[path];
              if (!lb) { local.books[path] = rb; changed = true; }
              else {
                var localTime = lb.updatedAt || lb.resetAt || 0;
                var remoteTime = rb.updatedAt || rb.resetAt || 0;
                if (localTime || remoteTime) {
                  // Timestamped: newest state wins (supports resets)
                  if (remoteTime > localTime) {
                    rb.words = Math.max(rb.words || 0, lb.words || 0);
                    rb.maxWordsRead = Math.max(rb.maxWordsRead || 0, lb.maxWordsRead || 0);
                    rb.maxScroll = Math.max(rb.maxScroll || 0, lb.maxScroll || 0);
                    local.books[path] = rb;
                    changed = true;
                  }
                } else {
                  // Legacy records without timestamps: highest wins
                  if ((rb.maxScroll || 0) > (lb.maxScroll || 0)) { lb.maxScroll = rb.maxScroll; changed = true; }
                  if ((rb.maxWordsRead || 0) > (lb.maxWordsRead || 0)) { lb.maxWordsRead = rb.maxWordsRead; changed = true; }
                  if ((rb.words || 0) > (lb.words || 0)) { lb.words = rb.words; changed = true; }
                }
              }
            });
          }
          if (remote.sessions && remote.sessions.length > 0) {
            if (!local.sessions) local.sessions = [];
            var existing = {};
            local.sessions.forEach(function(s) { existing[s.ts || s.date] = true; });
            remote.sessions.forEach(function(s) {
              if (!existing[s.ts || s.date]) { local.sessions.push(s); changed = true; }
            });
            if (local.sessions.length > 50) local.sessions = local.sessions.slice(-50);
          }
          // Sync reader model — take the one with more samples
          if (remote.reader) {
            if (!local.reader || (remote.reader.samples || 0) > (local.reader.samples || 0)) {
              local.reader = remote.reader;
              changed = true;
            }
          }
          if (changed) {
            localStorage.setItem(window._RS_KEY, JSON.stringify(local));
            if (window._renderProgress) window._renderProgress();
          }
        }
      }
      checkDone();
    });
    jsonpFetch(SYNC_URL + '?action=get_moved', function(err, movedData) {
      if (!err && movedData && movedData.status === 'ok' && movedData.moved) {
        // Merge by newest timestamp
        var local = getMovedToShelf();
        var remote = movedData.moved;
        for (var k in remote) {
          var rTs = (remote[k] && remote[k].ts) || 0;
          var lTs = (local[k] && local[k].ts) || 0;
          if (rTs >= lTs) { local[k] = remote[k]; }
        }
        localStorage.setItem(SHELF_MOVED_KEY, JSON.stringify(local));
        renderMovedToShelf();
      }
      checkDone();
    });
  }
  syncFromBackend();

  // Re-fetch when page becomes visible (fixes Reading filter after setting bookmark in a book)
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      syncFromBackend();
      // Always re-render progress from localStorage (local reading
      // data changes won't trigger the remote-only sync re-render)
      if (window._renderProgress) window._renderProgress();
    }
  });
  // Handle bfcache restoration (Android back button)
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) {
      render();
      if (window._renderProgress) window._renderProgress();
    }
  });

  // ── Move to Shelf ─────────────────────────────────────────────
  // Simplified: shelf always shows all books from books.json.
  // "Move to shelf" only hides the book from the To Read queue.
  var SHELF_MOVED_KEY = 'books_moved_to_shelf';

  function getMovedToShelf() {
    try {
      return JSON.parse(
        localStorage.getItem(SHELF_MOVED_KEY)
      ) || {};
    } catch(e) { return {}; }
  }

  function moveToShelf(e, id, sectionName) {
    e.preventDefault();
    e.stopPropagation();
    var moved = getMovedToShelf();
    moved[id] = {
      section: sectionName,
      ts: Date.now(),
      removed: false
    };
    localStorage.setItem(
      SHELF_MOVED_KEY, JSON.stringify(moved)
    );
    renderMovedToShelf();
    if (syncReady && SYNC_URL &&
        SYNC_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
      jsonpFetch(SYNC_URL +
        '?action=move_to_shelf&book=' +
        encodeURIComponent(id) +
        '&section=' +
        encodeURIComponent(sectionName), function(){});
    }
  }

  function unmoveFromShelf(e, id) {
    e.preventDefault();
    e.stopPropagation();
    var moved = getMovedToShelf();
    if (moved[id]) {
      moved[id].removed = true;
      moved[id].ts = Date.now();
    }
    localStorage.setItem(
      SHELF_MOVED_KEY, JSON.stringify(moved)
    );
    renderMovedToShelf();
    render();
    if (syncReady && SYNC_URL &&
        SYNC_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
      jsonpFetch(SYNC_URL +
        '?action=unmove_from_shelf&book=' +
        encodeURIComponent(id), function(){});
    }
  }

  function renderMovedToShelf() {
    var moved = getMovedToShelf();
    // Only control To Read card visibility
    document.querySelectorAll(
      '#toReadView .book'
    ).forEach(function(el) {
      var id = el.dataset.book;
      var entry = moved[id];
      if (entry && !entry.removed) {
        el.style.display = 'none';
      } else {
        el.style.display = '';
      }
    });
    // Hide empty To Read sections
    document.querySelectorAll(
      '#toReadView .section-title'
    ).forEach(function(title) {
      if (title.textContent.trim() === 'To Read') return;
      var shelf = title.nextElementSibling;
      if (!shelf || !shelf.classList.contains('shelf'))
        return;
      var hasVisible = false;
      shelf.querySelectorAll('.book').forEach(function(b) {
        if (b.style.display !== 'none') hasVisible = true;
      });
      title.style.display = hasVisible ? '' : 'none';
      shelf.style.display = hasVisible ? '' : 'none';
    });
  }
</script>

<script>
// ── Reading Progress on Shelf ──
(function() {
  var RS_KEY = 'reading_speed_data';

  function renderProgress() {
    document.querySelectorAll(
      '.read-progress-wrap, .read-eta'
    ).forEach(function(el) {
      if (el.closest('[data-no-eta]')) return;
      el.remove();
    });
    var oldBadge = document.getElementById('wpmBadge');
    if (oldBadge) oldBadge.remove();

    var data;
    try {
      data = JSON.parse(localStorage.getItem(RS_KEY));
    } catch(e) { return; }
    if (!data || !data.books) return;

    // Reset corrupted WPM (one-time fix for outlier spikes)
    if (data.reader && (data.reader.averageWPM > 500 || data.reader.averageWPM < 80)) {
      data.reader = { averageWPM: 225, samples: 0 };
      localStorage.setItem(RS_KEY, JSON.stringify(data));
    }

    // Use Kindle-style EMA average if available, else default
    var avgWpm = (data.reader && data.reader.samples >= 3)
      ? data.reader.averageWPM
      : 225;

    // Build lookup: normalize paths once
    var bookIndex = {};
    Object.keys(data.books).forEach(function(path) {
      // Store by last two path segments for fast matching
      var parts = path.split('/');
      var key = parts.slice(-2).join('/');
      bookIndex[key] = data.books[path];
      // Also store by folder name alone
      if (parts.length >= 2) {
        bookIndex[parts[parts.length - 2]] = data.books[path];
      }
    });

    document.querySelectorAll('.book[href]').forEach(function(el) {
      var href = el.getAttribute('href');
      if (!href) return;

      // Fast lookup instead of O(n) scan
      var hParts = href.replace(/^\.\//, '').split('/');
      var match = bookIndex[hParts.slice(-2).join('/')] ||
                  bookIndex[hParts[0]] || null;
      if (!match) return;

      var pct = match.words ? Math.round((match.maxWordsRead || 0) / match.words * 100) : 0;
      var inToRead = !!el.closest('#toReadView');

      if (inToRead) {
        if (match.words) {
          // Show progress bar if started
          if (pct >= 1) {
            var wrap = document.createElement('div');
            wrap.className = 'read-progress-wrap';
            var bar = document.createElement('div');
            bar.className = 'read-progress-bar';
            bar.style.width = pct + '%';
            wrap.appendChild(bar);
            el.appendChild(wrap);
          }
          var eta = document.createElement('div');
          eta.className = 'read-eta';
          if (pct >= 1) {
            var wordsLeft = Math.max(0,
              match.words - (match.maxWordsRead || 0));
            var minsLeft = Math.round(wordsLeft / avgWpm);
            if (pct >= 95) {
              eta.textContent = 'Finished';
            } else if (minsLeft < 60) {
              eta.textContent = pct + '% · ~' + minsLeft + 'm left';
            } else {
              var hrs = Math.floor(minsLeft / 60);
              var mins = minsLeft % 60;
              eta.textContent = pct + '% · ~' + hrs + 'h '
                + mins + 'm left';
            }
          } else {
            var totalMins = Math.round(match.words / avgWpm);
            if (totalMins < 60) {
              eta.textContent = '~' + totalMins + 'm read';
            } else {
              var hrs = Math.floor(totalMins / 60);
              var mins = totalMins % 60;
              eta.textContent = '~' + hrs + 'h '
                + mins + 'm read';
            }
          }
          el.appendChild(eta);
        }
        return;
      }

      if (pct < 1) return;

      // Progress bar
      var wrap = document.createElement('div');
      wrap.className = 'read-progress-wrap';
      var bar = document.createElement('div');
      bar.className = 'read-progress-bar';
      bar.style.width = pct + '%';
      wrap.appendChild(bar);
      el.appendChild(wrap);

      // ETA label
      if (match.words) {
        var wordsLeft = Math.max(0, match.words - (match.maxWordsRead || 0));
        var minsLeft = Math.round(wordsLeft / avgWpm);
        var eta = document.createElement('div');
        eta.className = 'read-eta';
        if (pct >= 95) {
          eta.textContent = 'Finished';
        } else if (minsLeft < 60) {
          eta.textContent = '~' + minsLeft + 'm left';
        } else {
          var hrs = Math.floor(minsLeft / 60);
          var mins = minsLeft % 60;
          eta.textContent = '~' + hrs + 'h ' + mins + 'm left';
        }
        el.appendChild(eta);
      }
    });
  }

  // Render from localStorage immediately (no network wait)
  renderProgress();

  // Expose for the main sync to call after merging remote data
  window._renderProgress = renderProgress;
  window._RS_KEY = RS_KEY;
})();
</script>

<script>
// Register service worker for offline reading
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js', {
    updateViaCache: 'none'
  }).then(function(reg) {
    // Check for updates immediately on every page load
    reg.update();
  });
}

// Called after bookmark sync completes to pre-cache reading books
function precacheReadingBooks() {
  if (!navigator.serviceWorker) return;
  navigator.serviceWorker.ready.then(function(reg) {
    var sw = reg.active || reg.installing || reg.waiting;
    if (!sw) return;
    var cached = 0;
    document.querySelectorAll('.book[data-bmkey]')
      .forEach(function(el) {
        var bmkey = el.dataset.bmkey;
        if (bmkey && activeBookmarks[bmkey]) {
          var href = el.getAttribute('href');
          if (href) {
            sw.postMessage({
              type: 'cache-book',
              path: './' + href
            });
            cached++;
          }
        }
      });
    if (cached > 0) {
      console.log('[SW] Pre-caching ' + cached +
        ' reading books for offline');
    }
  });
}
</script>

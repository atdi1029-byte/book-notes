<!DOCTYPE html>
<html><head><title>Book Debug</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:2em;font-size:1.1em">
<h2>Book.js Debug</h2>
<pre id="log"></pre>
<script>
var L = function(m){ document.getElementById('log').textContent += m + '\n'; };

// 1. Check localStorage
var rs = null;
try {
  rs = JSON.parse(localStorage.getItem('reading_speed_data'));
  if (rs && rs.books) {
    L('LOCAL STORAGE OK');
    Object.keys(rs.books).forEach(function(k) {
      L('  ' + k + ': ' + Math.round((rs.books[k].maxScroll||0)*100) + '%');
    });
    L('  Reader: ' + JSON.stringify(rs.reader));
    L('  Sessions: ' + (rs.sessions||[]).length);
  } else {
    L('LOCAL STORAGE: empty or no books');
  }
} catch(e) { L('LOCAL STORAGE ERROR: ' + e); }

// 2. Test JSONP sync
L('\nTesting sync...');
var SYNC_URL = 'https://script.google.com/macros/s/AKfycbwt438APIycBc534W6T66O3IgtxLUU9cczw-PZAN6Mc9p2xfU2ySsND_wEMJDHUvrXyUg/exec';
var testData = JSON.stringify({books:{"debug/test":{"words":100,"maxScroll":0.99,"title":"DEBUG TEST"}},"reader":{"averageWPM":200,"samples":0},"sessions":[]});
var cbName = '_dbgCb_' + Date.now();
var script = document.createElement('script');
window[cbName] = function(resp) {
  L('SYNC RESPONSE: ' + JSON.stringify(resp));
  delete window[cbName];
};
var url = SYNC_URL + '?action=set_bookmark&key=reading_speed_data&data=' + encodeURIComponent(testData) + '&callback=' + cbName;
L('URL length: ' + url.length);
script.src = url;
script.onerror = function() { L('SYNC FAILED (script error)'); };
document.head.appendChild(script);
setTimeout(function() {
  if (window[cbName]) L('SYNC TIMEOUT (no response after 10s)');
}, 10000);
</script>
</body></html>

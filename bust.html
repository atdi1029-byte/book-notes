<!DOCTYPE html>
<html><head><title>Cache Bust</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;
  padding:2em;font-size:1.2em">
<h2>Busting cache...</h2>
<pre id="log"></pre>
<script>
var log = document.getElementById('log');
function L(m){ log.textContent += m + '\n'; }

(async function(){
  // 1. Unregister all service workers
  if ('serviceWorker' in navigator) {
    var regs = await navigator.serviceWorker.getRegistrations();
    for (var r of regs) {
      // Force waiting SW to activate before unregistering
      if (r.waiting) {
        r.waiting.postMessage({type: 'SKIP_WAITING'});
        L('Forced waiting SW to activate');
        await new Promise(function(res) { setTimeout(res, 500); });
      }
      await r.unregister();
      L('Unregistered SW: ' + r.scope);
    }
  } else { L('No SW support'); }

  // 2. Delete ALL caches
  var names = await caches.keys();
  for (var n of names) {
    await caches.delete(n);
    L('Deleted cache: ' + n);
  }

  // 3. Force-refresh key JS files (bypass HTTP cache)
  var files = ['./book.js', './service-worker.js', './index.html'];
  for (var f of files) {
    await fetch(f, { cache: 'reload' });
    L('Cache-busted: ' + f);
  }

  // 4. Re-register fresh SW
  if ('serviceWorker' in navigator) {
    var reg = await navigator.serviceWorker.register('./service-worker.js');
    L('Re-registered SW (new)');
  }

  L('\nDone! Redirecting in 2s...');
  setTimeout(function(){
    window.location.href = './index.html?bust=' + Date.now();
  }, 2000);
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=3.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0804">
<title>Book Universe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0e0804;
  --bg2: #1a120a;
  --text: #e8dcc8;
  --text2: rgba(232,220,200,0.6);
  --text3: rgba(232,220,200,0.35);
  --accent: #c5a55a;
  --accent2: #4a9a8f;
  --border: rgba(232,220,200,0.12);
  --card-bg: rgba(232,220,200,0.04);
  --card-hover: rgba(232,220,200,0.08);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0; z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: rgba(14,8,4,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  color: var(--text2);
  font-size: 0.8rem;
  font-family: -apple-system, sans-serif;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 18px;
  cursor: pointer;
  background: none;
  transition: all 0.2s;
  white-space: nowrap;
}

.back-btn:hover {
  color: var(--text);
  border-color: rgba(232,220,200,0.3);
  background: var(--card-bg);
}

.back-btn svg {
  width: 13px; height: 13px;
  stroke: currentColor; fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.header h1 {
  font-size: 1.2rem;
  color: var(--text);
  flex: 1;
}

.header .stats {
  font-size: 0.72rem;
  color: var(--text3);
  font-family: -apple-system, sans-serif;
}

/* ── Search ── */
.search-wrap {
  padding: 16px 20px 8px;
  max-width: 700px;
  margin: 0 auto;
}

.search-box {
  width: 100%;
  padding: 10px 16px 10px 38px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 0.9rem;
  font-family: -apple-system, sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

.search-box::placeholder { color: var(--text3); }
.search-box:focus { border-color: var(--accent); }

.search-wrap .search-icon {
  position: absolute;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  stroke: var(--text3);
  fill: none;
  stroke-width: 2;
  pointer-events: none;
}

.search-wrap { position: relative; }

/* ── Breadcrumb ── */
.breadcrumb {
  padding: 12px 20px 4px;
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-family: -apple-system, sans-serif;
  color: var(--text3);
  flex-wrap: wrap;
}

.breadcrumb .crumb {
  cursor: pointer;
  color: var(--text2);
  transition: color 0.2s;
}

.breadcrumb .crumb:hover { color: var(--accent); }
.breadcrumb .sep { color: var(--text3); }

/* ── Content ── */
.content {
  max-width: 700px;
  margin: 0 auto;
  padding: 8px 20px 60px;
}

/* ── Category cards (Level 1) ── */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.cat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.cat-card:hover {
  background: var(--card-hover);
  border-color: rgba(232,220,200,0.2);
  transform: translateY(-2px);
}

.cat-card .cat-icon {
  font-size: 1.8rem;
  margin-bottom: 8px;
}

.cat-card .cat-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.cat-card .cat-count {
  font-size: 0.78rem;
  color: var(--text2);
  font-family: -apple-system, sans-serif;
}

.cat-card .cat-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
}

/* ── Subcategory pills ── */
.subcat-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0 12px;
}

.subcat-pill {
  padding: 6px 14px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.8rem;
  font-family: -apple-system, sans-serif;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}

.subcat-pill:hover, .subcat-pill.active {
  background: var(--card-hover);
  border-color: var(--accent);
  color: var(--text);
}

.subcat-pill .pill-count {
  color: var(--text3);
  margin-left: 4px;
}

/* ── Book list (Level 2) ── */
.book-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.book-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.book-row:hover {
  background: var(--card-hover);
  border-color: rgba(232,220,200,0.2);
}

.book-row .cover {
  width: 44px; height: 58px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg2);
}

.book-row .book-info { flex: 1; min-width: 0; }

.book-row .book-title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-row .book-author {
  font-size: 0.78rem;
  color: var(--text2);
  font-family: -apple-system, sans-serif;
}

.book-row .book-meta {
  display: flex;
  gap: 10px;
  font-size: 0.7rem;
  color: var(--text3);
  font-family: -apple-system, sans-serif;
  margin-top: 2px;
}

.book-row .conn-badge {
  font-size: 0.7rem;
  color: var(--accent2);
  background: rgba(74,154,143,0.12);
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}

.book-row .read-badge {
  font-size: 0.65rem;
  color: var(--accent);
  background: rgba(197,165,90,0.12);
  padding: 2px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}

/* ── Book detail (Level 3) ── */
.book-detail { margin-top: 8px; }

.detail-header {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  margin-bottom: 20px;
}

.detail-cover {
  width: 90px; height: 120px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

.detail-info { flex: 1; }

.detail-info h2 {
  font-size: 1.3rem;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 4px;
}

.detail-info .author {
  font-size: 0.9rem;
  color: var(--text2);
  font-style: italic;
  margin-bottom: 10px;
}

.detail-info .tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.detail-info .tag {
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 12px;
  font-family: -apple-system, sans-serif;
  border: 1px solid var(--border);
  color: var(--text2);
}

.view-notes-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 8px 16px;
  background: rgba(197,165,90,0.12);
  border: 1px solid rgba(197,165,90,0.25);
  border-radius: 8px;
  color: var(--accent);
  text-decoration: none;
  font-size: 0.82rem;
  font-family: -apple-system, sans-serif;
  transition: all 0.2s;
}

.view-notes-btn:hover {
  background: rgba(197,165,90,0.2);
  border-color: var(--accent);
}

/* ── Connection sections ── */
.section-heading {
  font-size: 0.82rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: -apple-system, sans-serif;
  margin: 24px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.conn-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
}

.conn-card:hover {
  background: var(--card-hover);
  border-color: rgba(232,220,200,0.2);
}

.conn-card .conn-cover {
  width: 36px; height: 48px;
  border-radius: 3px;
  object-fit: cover;
  flex-shrink: 0;
}

.conn-card .conn-info { flex: 1; min-width: 0; }

.conn-card .conn-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
}

.conn-card .conn-author {
  font-size: 0.72rem;
  color: var(--text2);
  font-family: -apple-system, sans-serif;
}

.conn-card .conn-shared {
  font-size: 0.7rem;
  color: var(--text3);
  font-family: -apple-system, sans-serif;
  margin-top: 2px;
}

.conn-card .conn-arrow {
  color: var(--text3);
  font-size: 1rem;
  flex-shrink: 0;
}

/* ── Referenced works table ── */
.ref-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  margin-top: 8px;
}

.ref-table th {
  text-align: left;
  color: var(--text3);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-family: -apple-system, sans-serif;
}

.ref-table td {
  padding: 7px 10px;
  border-bottom: 1px solid rgba(232,220,200,0.06);
  color: var(--text2);
  vertical-align: top;
}

.ref-table td:first-child {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
}

.ref-table tr.on-shelf td:first-child {
  color: var(--accent2);
  cursor: pointer;
}

.ref-table tr.on-shelf:hover { background: var(--card-bg); }

/* ── Local graph ── */
.local-graph-wrap {
  margin-top: 12px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.local-graph-wrap svg {
  display: block;
  width: 100%;
}

.local-graph-wrap .graph-label {
  font-family: -apple-system, sans-serif;
  fill: var(--text2);
  font-size: 9px;
  text-anchor: middle;
  pointer-events: none;
}

.local-graph-wrap .graph-node {
  cursor: pointer;
}

.local-graph-wrap .graph-link {
  stroke: rgba(232,220,200,0.15);
  stroke-width: 1.5;
  fill: none;
}

.local-graph-wrap .graph-node-circle {
  stroke: rgba(232,220,200,0.2);
  stroke-width: 1.5;
}

/* ── Explore Ideas ── */
.trail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.trail-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.trail-card:hover {
  background: var(--card-hover);
  border-color: rgba(232,220,200,0.2);
  transform: translateY(-1px);
}

.trail-card .trail-name {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.trail-card .trail-count {
  font-size: 0.72rem;
  color: var(--text3);
  font-family: -apple-system, sans-serif;
}

/* ── Trail view ── */
.trail-chain {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 12px;
}

.trail-step {
  display: flex;
  align-items: stretch;
  gap: 14px;
}

.trail-line {
  width: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

.trail-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  margin-top: 18px;
}

.trail-stem {
  width: 2px;
  flex: 1;
  background: var(--border);
}

.trail-step:last-child .trail-stem { display: none; }

.trail-book {
  flex: 1;
  padding: 12px 0;
}

.trail-book .trail-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}

.trail-book .trail-title:hover { color: var(--accent); }

.trail-book .trail-author {
  font-size: 0.75rem;
  color: var(--text2);
  font-family: -apple-system, sans-serif;
}

.trail-book .trail-why {
  font-size: 0.78rem;
  color: var(--text3);
  font-style: italic;
  margin-top: 3px;
}

/* ── Tabs ── */
.tab-row {
  display: flex;
  gap: 0;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

.tab-btn {
  padding: 8px 18px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text3);
  font-size: 0.82rem;
  font-family: -apple-system, sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn:hover { color: var(--text2); }

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text3);
  font-style: italic;
  font-size: 0.9rem;
}

/* ── Search results ── */
.search-results { margin-top: 8px; }

.search-section-label {
  font-size: 0.72rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-family: -apple-system, sans-serif;
  margin: 14px 0 6px;
}

/* ── Mobile ── */
@media (max-width: 500px) {
  .cat-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .cat-card { padding: 14px; }
  .cat-card .cat-icon { font-size: 1.4rem; }
  .trail-grid {
    grid-template-columns: 1fr 1fr;
  }
  .detail-cover { width: 70px; height: 93px; }
  .detail-info h2 { font-size: 1.1rem; }
}
</style>
</head>

<div class="header">

</div>

<div class="breadcrumb" id="breadcrumb"></div>

<div class="content" id="content"></div>

// ── Load data ──
async function init() {
  try {
    const resp = await fetch('metadata.json');
    DATA = await resp.json();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state">Failed to load metadata.json.'
      + ' Run build_metadata.py first.</div>';
    return;
  }

  // Build book lookup from lightweight stubs
  DATA.books.forEach(b => { bookMap[b.id] = b; });

  document.getElementById('stats').textContent =
    DATA.totalBooks + ' books \u00B7 '
    + DATA.totalEdges + ' connections';

  // Check URL hash
  if (location.hash) parseHash();
  else renderCategories();

  // Search
  document.getElementById('searchBox')
    .addEventListener('input', onSearch);
}

// Lazy-load per-book detail
async function loadDetail(id) {
  if (detailCache[id]) return detailCache[id];
  try {
    const resp = await fetch('metadata/' + id + '.json');
    const detail = await resp.json();
    detailCache[id] = detail;
    return detail;
  } catch(e) {
    return null;
  }
}

function parseHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('book/')) {
    const id = h.slice(5);
    if (bookMap[id]) {
      navigateToBook(id, true);
      return;
    }
  }
  if (h.startsWith('cat/')) {
    const sc = decodeURIComponent(h.slice(4));
    navigateToSuperCat(sc, true);
    return;
  }
  if (h.startsWith('trail/')) {
    const idx = parseInt(h.slice(6));
    if (TRAILS[idx]) {
      showTrail(idx, true);
      return;
    }
  }
  renderCategories();
}

// ── Navigation ──
function setHash(h) { history.pushState(null, '', '#' + h); }

function navigateToSuperCat(sc, noHash) {
  view = { level: 'books', superCat: sc,
    subCat: null, bookId: null, trail: null };
  if (!noHash) setHash('cat/' + encodeURIComponent(sc));
  renderBooks(sc);
  updateBreadcrumb();
  scrollTop();
}

async function navigateToBook(id, noHash) {
  const book = bookMap[id];
  if (!book) return;
  view = { level: 'detail', superCat: book.sc,
    subCat: book.category, bookId: id, trail: null };
  if (!noHash) setHash('book/' + id);
  await renderDetail(id);
  updateBreadcrumb();
  scrollTop();
}

function navigateHome() {
  view = { level: 'categories', superCat: null,
    subCat: null, bookId: null, trail: null };
  history.pushState(null, '', location.pathname);
  renderCategories();
  updateBreadcrumb();
  scrollTop();
  document.getElementById('searchBox').value = '';
}

function showTrail(idx, noHash) {
  view = { level: 'trail', trail: idx };
  if (!noHash) setHash('trail/' + idx);
  renderTrail(idx);
  updateBreadcrumb();
  scrollTop();
}

function scrollTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('popstate', () => {
  if (location.hash) parseHash();
  else { view.level = 'categories'; renderCategories();
    updateBreadcrumb(); }
});

// ── Breadcrumb ──
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = '<span class="crumb" onclick="navigateHome()">'
    + 'Universe</span>';

  if (view.level === 'books' || view.level === 'detail') {
    html += '<span class="sep">\u203A</span>';
    html += '<span class="crumb" onclick="navigateToSuperCat(\''
      + escQ(view.superCat) + '\')">'
      + esc(view.superCat) + '</span>';
  }
  if (view.level === 'detail' && view.bookId) {
    const b = bookMap[view.bookId];
    html += '<span class="sep">\u203A</span>';
    html += '<span>' + esc(b.title) + '</span>';
  }
  if (view.level === 'trail' && view.trail !== null) {
    html += '<span class="sep">\u203A</span>';
    html += '<span>Explore Ideas</span>';
    html += '<span class="sep">\u203A</span>';
    html += '<span>' + esc(TRAILS[view.trail].name)
      + '</span>';
  }

  bc.innerHTML = html;
}

// ── Render: Categories (Level 1) ──
function renderCategories() {
  const el = document.getElementById('content');
  let html = '';

  // Category grid — precomputed, no sorting needed
  html += '<div class="cat-grid">';
  const entries = Object.entries(DATA.categories);
  entries.sort((a, b) => b[1].count - a[1].count);
  for (const [sc, info] of entries) {
    const color = CAT_COLORS[sc] || '#999';
    const icon = CAT_ICONS[sc] || '\u{1F4DA}';
    html += '<div class="cat-card" onclick='
      + '"navigateToSuperCat(\'' + escQ(sc) + '\')">';
    html += '<div class="cat-icon">' + icon + '</div>';
    html += '<div class="cat-name">' + esc(sc) + '</div>';
    html += '<div class="cat-count">' + info.count
      + ' books</div>';
    html += '<div class="cat-bar" style="background:'
      + color + '"></div>';
    html += '</div>';
  }
  html += '</div>';

  // Explore Ideas section
  html += '<div class="section-heading" '
    + 'style="margin-top:32px">'
    + 'Explore Ideas</div>';
  html += '<div class="trail-grid">';
  TRAILS.forEach((trail, idx) => {
    const validCount = trail.books
      .filter(b => bookMap[b.id]).length;
    html += '<div class="trail-card" onclick='
      + '"showTrail(' + idx + ')">';
    html += '<div class="trail-name">'
      + esc(trail.name) + '</div>';
    html += '<div class="trail-count">'
      + validCount + ' books \u00B7 '
      + esc(trail.desc) + '</div>';
    html += '</div>';
  });
  html += '</div>';

  // Most connected — precomputed list, just render
  html += '<div class="section-heading" '
    + 'style="margin-top:24px">'
    + 'Most Connected</div>';
  html += '<div class="book-list">';
  for (const id of DATA.mostConnected) {
    const b = bookMap[id];
    if (b) html += bookRowHtml(b);
  }
  html += '</div>';

  el.innerHTML = html;
}

// ── Render: Books in category (Level 2) ──
function renderBooks(superCat) {
  const el = document.getElementById('content');
  const catInfo = DATA.categories[superCat];
  if (!catInfo) return;

  // Books already sorted by build script
  const bookIds = catInfo.books;
  const books = bookIds.map(id => bookMap[id])
    .filter(Boolean);
  const subcats = Object.entries(catInfo.subcategories);

  let html = '';

  // Subcategory pills
  html += '<div class="subcat-row">';
  html += '<div class="subcat-pill active" '
    + 'onclick="filterSubcat(null, this)">All'
    + '<span class="pill-count">'
    + books.length + '</span></div>';
  for (const [sc, count] of subcats) {
    html += '<div class="subcat-pill" '
      + 'onclick="filterSubcat(\'' + escQ(sc)
      + '\', this)">' + esc(sc)
      + '<span class="pill-count">'
      + count + '</span></div>';
  }
  html += '</div>';

  html += '<div class="book-list" id="bookList">';
  for (const b of books) {
    html += bookRowHtml(b);
  }
  html += '</div>';

  el.innerHTML = html;
}

function filterSubcat(subCat, pill) {
  document.querySelectorAll('.subcat-pill')
    .forEach(p => p.classList.remove('active'));
  pill.classList.add('active');

  const list = document.getElementById('bookList');
  const catInfo = DATA.categories[view.superCat];
  const books = catInfo.books
    .map(id => bookMap[id])
    .filter(b => b && (!subCat || b.category === subCat));

  let html = '';
  for (const b of books) {
    html += bookRowHtml(b);
  }
  list.innerHTML = html;
}

function bookRowHtml(b) {
  let html = '<div class="book-row" '
    + 'onclick="navigateToBook(\'' + escQ(b.id) + '\')">';
  html += '<img class="cover" loading="lazy" src="'
    + esc(b.dir) + '/thumb.jpg" alt=""'
    + ' onerror="this.src=\'' + esc(b.dir)
    + '/cover.jpg\'">';
  html += '<div class="book-info">';
  html += '<div class="book-title">'
    + esc(b.title) + '</div>';
  html += '<div class="book-author">'
    + esc(b.author) + '</div>';
  html += '<div class="book-meta">';
  html += '<span>' + esc(b.category) + '</span>';
  if (b.refs > 0)
    html += '<span>' + b.refs + ' refs</span>';
  html += '</div>';
  html += '</div>';
  if (b.conn > 0)
    html += '<span class="conn-badge">'
      + b.conn + ' conn</span>';
  if (b.read)
    html += '<span class="read-badge">\u2713 Read</span>';
  html += '</div>';
  return html;
}

  let html = '';

    + esc(b.dir) + '/cover.jpg" alt="">';
  html += '<div class="detail-info">';
  html += '<h2>' + esc(b.title) + '</h2>';
  html += '<div class="author">' + esc(b.author) + '</div>';
  html += '<div class="tag-row">';
  html += '<span class="tag" style="border-color:'
    + color + ';color:' + color + '">'
    + esc(b.sc) + '</span>';
  html += '<span class="tag">' + esc(b.category) + '</span>';
  if (b.conn > 0)
    html += '<span class="tag" style="border-color:'
      + 'var(--accent2);color:var(--accent2)">'
      + b.conn + ' connections</span>';
  if (b.read)
    html += '<span class="tag" style="border-color:'
      + 'var(--accent);color:var(--accent)">'

    });

  html += '<a class="view-notes-btn" href="'
    + esc(b.dir) + '/index.html">'
    + 'View full notes \u2192</a>';

  // Tabs
  html += '<div class="tab-row">';
  html += '<button class="tab-btn active" '
    + 'onclick="switchDetailTab(\'connections\',this)">'
    + 'Connections</button>';
  html += '<button class="tab-btn" '
    + 'onclick="switchDetailTab(\'references\',this)">'
    + 'Referenced Works</button>';
  html += '<button class="tab-btn" '
    + 'onclick="switchDetailTab(\'graph\',this)">'
    + 'Graph</button>';

  html += '<div id="detailTabContent">'
    + '<div class="empty-state">Loading...</div></div>';

  el.innerHTML = html;

  await loadDetail(id);

function switchDetailTab(tab, btn) {
  document.querySelectorAll('.tab-btn')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (tab === 'connections')
    renderConnectionsTab(view.bookId);
  else if (tab === 'references')
    renderReferencesTab(view.bookId);
  else if (tab === 'graph')
    renderGraphTab(view.bookId);
}

function renderConnectionsTab(id) {
  const el = document.getElementById('detailTabContent');
  const detail = detailCache[id];
  if (!detail || !detail.connections
    || detail.connections.length === 0) {
    el.innerHTML = '<div class="empty-state">'
      + 'No connections found with other books '
      + 'on your shelf.</div>';
    return;
  }

  // Connections already sorted by build script
  const b = bookMap[id];
  const sameCat = detail.connections.filter(
    c => c.superCategory === b.sc);
  const diffCat = detail.connections.filter(
    c => c.superCategory !== b.sc);

  let html = '';

  if (sameCat.length > 0) {
    html += '<div class="section-heading">Within '
      + esc(b.sc)
      + ' (' + sameCat.length + ')</div>';
    for (const c of sameCat)
      html += connCardHtml(c);
  }

  if (diffCat.length > 0) {
    html += '<div class="section-heading">'
      + 'Cross-Category ('
      + diffCat.length + ')</div>';
    for (const c of diffCat)
      html += connCardHtml(c);
  }

  el.innerHTML = html;
}

function connCardHtml(c) {
  const color = CAT_COLORS[c.superCategory] || '#999';
  let html = '<div class="conn-card" '
    + 'onclick="navigateToBook(\''
    + escQ(c.id) + '\')">';
  html += '<img class="conn-cover" loading="lazy" src="'
    + esc(c.dir) + '/thumb.jpg" alt=""'
    + ' onerror="this.src=\'' + esc(c.dir)
    + '/cover.jpg\'">';
  html += '<div class="conn-info">';
  html += '<div class="conn-title">'
    + esc(c.title) + '</div>';
  html += '<div class="conn-author">'
    + esc(c.author) + '</div>';
  html += '<div class="conn-shared">Shared: '
    + c.shared.map(s => esc(s)).join(', ')
    + '</div>';
  html += '</div>';
  html += '<span class="conn-arrow" '
    + 'style="color:' + color + '">\u203A</span>';
  html += '</div>';
  return html;
}

function renderReferencesTab(id) {
  const el = document.getElementById('detailTabContent');
  const detail = detailCache[id];
  if (!detail || !detail.references
    || detail.references.length === 0) {
    el.innerHTML = '<div class="empty-state">'
      + 'No referenced works table found.</div>';
    return;
  }

  // Build shelf author lookup
  const shelfAuthors = {};
  DATA.books.forEach(sb => {
    const surnames = getSurnames(sb.author);
    surnames.forEach(sn => {
      shelfAuthors[sn.toLowerCase()] = sb.id;
    });
  });

  let html = '<table class="ref-table">';
  html += '<tr><th>Name</th><th>Description</th></tr>';
  for (const ref of detail.references) {
    let onShelf = null;
    const nameLower = ref.name.toLowerCase();
    for (const [sn, sid] of Object.entries(shelfAuthors)) {
      if (nameLower.includes(sn) && sid !== id) {
        onShelf = sid;
        break;
      }
    }

    const cls = onShelf ? ' class="on-shelf"' : '';
    const onclick = onShelf
      ? ' onclick="navigateToBook(\''
        + escQ(onShelf) + '\')"'
      : '';
    html += '<tr' + cls + onclick + '>';
    html += '<td>' + esc(ref.name)
      + (onShelf ? ' \u{1F4DA}' : '') + '</td>';
    html += '<td>' + esc(ref.desc
      || ref.connection || '') + '</td>';
    html += '</tr>';
  }
  html += '</table>';

  el.innerHTML = html;
}

function renderGraphTab(id) {
  const el = document.getElementById('detailTabContent');
  const neighbors = DATA.adjacency[id];
  if (!neighbors || neighbors.length === 0) {
    el.innerHTML = '<div class="empty-state">'
      + 'No connections to visualize.</div>';
    return;
  }

  // Build local nodes from precomputed adjacency
  const nodeIds = new Set([id, ...neighbors]);
  const nodes = [...nodeIds].map(nid => ({
    id: nid,
    ...bookMap[nid],
    isCenter: nid === id,
  })).filter(n => n.title);

  // Build links from adjacency
  const links = [];
  const seen = new Set();
  for (const nid of neighbors) {
    const key = [id, nid].sort().join('|');
    if (!seen.has(key)) {
      seen.add(key);
      links.push({ source: id, target: nid });
    }
  }

  el.innerHTML = '<div class="local-graph-wrap">'
    + '<svg id="localGraph"></svg></div>';

  renderLocalGraph(nodes, links, id);
}

function renderLocalGraph(nodes, links, centerId) {
  const svg = document.getElementById('localGraph');
  const W = svg.parentElement.clientWidth;
  const H = Math.min(400, W * 0.7);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  const cx = W / 2, cy = H / 2;
  const radius = Math.min(W, H) * 0.32;

  // Position: center node in middle, others in a circle
  const others = nodes.filter(n => n.id !== centerId);
  const positions = {};
  positions[centerId] = { x: cx, y: cy };

  others.forEach((n, i) => {
    const angle = (2 * Math.PI * i / others.length)
      - Math.PI / 2;
    positions[n.id] = {
      x: cx + radius * Math.cos(angle),
      y: cy + radius * Math.sin(angle),
    };
  });

  let svgContent = '';

  // Draw links
  links.forEach(l => {
    const p1 = positions[l.source];
    const p2 = positions[l.target];
    if (!p1 || !p2) return;
    svgContent += '<line class="graph-link" '
      + 'x1="' + p1.x + '" y1="' + p1.y + '" '
      + 'x2="' + p2.x + '" y2="' + p2.y + '"/>';
  });

  // Draw nodes
  nodes.forEach(n => {
    const p = positions[n.id];
    if (!p) return;
    const r = n.isCenter ? 28 : 20;
    const color = CAT_COLORS[n.sc] || '#999';

    // Clip path for cover image
    const clipId = 'gc-' + n.id.replace(/[^a-z0-9]/g, '');
    svgContent += '<defs><clipPath id="' + clipId + '">'
      + '<circle cx="' + p.x + '" cy="' + p.y
      + '" r="' + r + '"/>'
      + '</clipPath></defs>';

    svgContent += '<g class="graph-node" '
      + 'onclick="navigateToBook(\''
      + escQ(n.id) + '\')">';

    // Cover image
    svgContent += '<image href="' + esc(n.dir)
      + '/cover.jpg" '
      + 'x="' + (p.x - r) + '" y="' + (p.y - r) + '" '
      + 'width="' + (r * 2) + '" height="' + (r * 2) + '" '
      + 'preserveAspectRatio="xMidYMid slice" '
      + 'clip-path="url(#' + clipId + ')"/>';

    // Border
    svgContent += '<circle class="graph-node-circle" '
      + 'cx="' + p.x + '" cy="' + p.y + '" r="' + r + '" '
      + 'fill="none" stroke="' + color + '" '
      + 'stroke-width="' + (n.isCenter ? 3 : 1.5) + '"/>';

    // Label
    const label = n.title.length > 18
      ? n.title.substring(0, 16) + '\u2026' : n.title;
    svgContent += '<text class="graph-label" '
      + 'x="' + p.x + '" y="' + (p.y + r + 14) + '">'
      + esc(label) + '</text>';

    svgContent += '</g>';
  });

  svg.innerHTML = svgContent;
}

// ── Render: Trail ──
function renderTrail(idx) {
  const el = document.getElementById('content');
  const trail = TRAILS[idx];
  if (!trail) return;

  let html = '<h2 style="margin-top:12px">'
    + esc(trail.name) + '</h2>';
  html += '<p style="color:var(--text2);'
    + 'font-size:0.88rem;margin-bottom:8px;'
    + 'font-style:italic">'
    + esc(trail.desc) + '</p>';

  html += '<div class="trail-chain">';
  for (const step of trail.books) {
    const b = bookMap[step.id];
    html += '<div class="trail-step">';
    html += '<div class="trail-line">';
    html += '<div class="trail-dot" style="background:'
      + (b ? CAT_COLORS[b.sc] || '#999'
        : 'var(--text3)')
      + '"></div>';
    html += '<div class="trail-stem"></div>';
    html += '</div>';
    html += '<div class="trail-book">';
    if (b) {
      html += '<div class="trail-title" '
        + 'onclick="navigateToBook(\''
        + escQ(b.id) + '\')">'
        + esc(b.title) + '</div>';
      html += '<div class="trail-author">'
        + esc(b.author) + '</div>';
    } else {
      html += '<div class="trail-title" '
        + 'style="color:var(--text3)">'
        + esc(step.id) + ' (not on shelf)</div>';
    }
    html += '<div class="trail-why">'
      + esc(step.why) + '</div>';
    html += '</div></div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

// ── Search ──
function onSearch(e) {
  const q = e.target.value.trim().toLowerCase();
  if (q.length < 2) {
    // Restore current view
    if (view.level === 'categories') renderCategories();
    else if (view.level === 'books')
      renderBooks(view.superCat);
    else if (view.level === 'detail')
      renderDetail(view.bookId);
    else if (view.level === 'trail')
      renderTrail(view.trail);
    return;
  }

  const el = document.getElementById('content');

  // Search books by title, author, category, keywords
  const bookResults = DATA.books.filter(b =>
    b.title.toLowerCase().includes(q)
    || b.author.toLowerCase().includes(q)
    || b.category.toLowerCase().includes(q)
    || (b.kw && b.kw.some(k => k.includes(q)))
  ).slice(0, 20);

  // Thinker search requires loading detail files
  // For now, search cached details only (instant)
  const thinkerResults = [];
  const seenThinkers = new Set();
  for (const [bid, detail] of Object.entries(detailCache)) {
    for (const ref of (detail.references || [])) {
      if (ref.name.toLowerCase().includes(q)
        && !seenThinkers.has(ref.name)) {
        seenThinkers.add(ref.name);
        const b = bookMap[bid];
        thinkerResults.push({
          name: ref.name,
          desc: ref.desc || ref.connection || '',
          bookId: bid,
          bookTitle: b ? b.title : bid,
        });
      }
    }
    if (thinkerResults.length >= 15) break;
  }

  // Search trails
  const trailResults = TRAILS.filter((t, i) =>
    t.name.toLowerCase().includes(q)
    || t.desc.toLowerCase().includes(q)
  );

  let html = '<div class="search-results">';

  if (bookResults.length > 0) {
    html += '<div class="search-section-label">Books</div>';
    html += '<div class="book-list">';
    for (const b of bookResults)
      html += bookRowHtml(b);
    html += '</div>';
  }

  if (thinkerResults.length > 0) {
    html += '<div class="search-section-label">'
      + 'Thinkers & References</div>';
    html += '<div class="book-list">';
    for (const t of thinkerResults) {
      html += '<div class="book-row" '
        + 'onclick="navigateToBook(\''
        + escQ(t.bookId) + '\')">';
      html += '<div class="book-info">';
      html += '<div class="book-title">'
        + esc(t.name) + '</div>';
      html += '<div class="book-author">'
        + esc(t.desc) + '</div>';
      html += '<div class="book-meta">'
        + '<span>Referenced in '
        + esc(t.bookTitle) + '</span></div>';
      html += '</div></div>';
    }
    html += '</div>';
  }

  if (trailResults.length > 0) {
    html += '<div class="search-section-label">'
      + 'Idea Trails</div>';
    html += '<div class="trail-grid">';
    trailResults.forEach(trail => {
      const idx = TRAILS.indexOf(trail);
      const validCount = trail.books
        .filter(b => bookMap[b.id]).length;
      html += '<div class="trail-card" '
        + 'onclick="showTrail(' + idx + ')">';
      html += '<div class="trail-name">'
        + esc(trail.name) + '</div>';
      html += '<div class="trail-count">'
        + validCount + ' books</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if (bookResults.length === 0
    && thinkerResults.length === 0
    && trailResults.length === 0) {
    html += '<div class="empty-state">'
      + 'No results for "' + esc(q) + '"</div>';
  }

  html += '</div>';
  el.innerHTML = html;
}

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escQ(s) {
  return s.replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}

function getSurnames(authorStr) {
  return authorStr.split(/[,&]+/)
    .map(s => s.trim())
    .filter(Boolean)
    .map(part => {
      const words = part.split(/\s+/);
      return words[words.length - 1];
    })
    .filter(s => s.length >= 3);
}

// ── Init ──
init();
</script>
